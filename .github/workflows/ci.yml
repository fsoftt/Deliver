name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, unit, architecture, contract & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Deliver.slnx

      - name: Build
        run: dotnet build Deliver.slnx -c Release --no-restore

      # Integration tests start PostgreSQL and RabbitMQ with Testcontainers (Docker is available on the runner).
      - name: Test
        run: dotnet test --solution Deliver.slnx -c Release --no-build

  end-to-end:
    name: docker compose up + end-to-end demo
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Start the whole system
        run: docker compose up -d --build --wait --wait-timeout 300 postgres rabbitmq && docker compose up -d --build

      - name: Run the Definition-of-Done walkthrough
        run: bash scripts/demo.sh

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Tear down
        if: always()
        run: docker compose down -v
