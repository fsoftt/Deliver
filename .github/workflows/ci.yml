name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Backend - build, unit, architecture, contract & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Deliver.slnx

      - name: Build
        run: dotnet build Deliver.slnx -c Release --no-restore

      # Integration tests start PostgreSQL and RabbitMQ with Testcontainers (Docker is available on the runner).
      - name: Test
        run: dotnet test --solution Deliver.slnx -c Release --no-build

  frontend:
    name: Frontend - lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  end-to-end:
    name: docker compose up + API walkthrough + UI end-to-end
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Start the whole system
        run: docker compose up -d --build --wait --wait-timeout 300 postgres rabbitmq && docker compose up -d --build

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Runs first, on a fresh system, so no backlog from other scenarios changes who gets dispatched.
      - name: UI end-to-end (Playwright against the running system)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          until curl -fsS http://localhost:3000/api/drivers >/dev/null 2>&1; do sleep 2; done
          for q in shipping fleet dispatch billing notifications analytics; do
            until curl -fsS -u deliver:deliver "http://localhost:15672/api/queues/%2F/$q" >/dev/null 2>&1; do sleep 2; done
          done
          npm run e2e

      - name: API walkthrough of the Definition of Done
        run: bash scripts/demo.sh

      - name: Upload UI screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            frontend/e2e/screenshots
            frontend/playwright-report

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Tear down
        if: always()
        run: docker compose down -v
